#
# PLIC end-to-end demo (`the development notes (not published here)`):
#   uart0 (PL011, PLIC line 24; driven by drivers/serial/uart_agm.c)
#   RX interrupt -> plic_irq_handler
#   -> sw_isr_table[56] agm_uart_isr -> callback. Verifies the MEIP /
#   PLIC claim/dispatch path that P0-1 restored.

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# gpio-leds (on-board LEDs via the Zephyr GPIO API)
CONFIG_GPIO=y
CONFIG_GPIO_STELLARIS=y
