# SPDX-License-Identifier: Apache-2.0

# --- Console / XIP ---
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# --- Networking: we only need L2 + the packet socket. There is no IP or
#     UDP stack in the TX path -- the frames are built by hand. IPv4 is
#     left on because the Ethernet L2 and the packet socket expect the
#     normal net stack to be present, but nothing here uses UDP/TCP. ---
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_DHCPV4=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_ETH_DRIVER=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y

# --- Static IPv4 for the board. It is only used as the source address
#     we write into the hand-built headers and into our ARP request. ---
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.15.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.15.254"

# --- Buffers: only a handful of packets are ever in the stack (our ARP
#     request/reply plus the frames in flight), so this stays small --
#     the throughput comes from reusing one frame buffer and one packet
#     socket, not from the net stack's pools. ---
# A whole frame has to fit in one buffer on this path: with the 128 B
# default the packet socket returns ENOBUFS for a 1502 B frame.
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

# --- Driver: same as lan8720_link / lan8720_iperf ---
CONFIG_ETH_AGM=y
CONFIG_MDIO_AGM=y
CONFIG_PHY_AGM_LAN8720=y
CONFIG_ETH_AGM_TX_DESCRIPTORS=8

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# --- LOG: 3 = INFO. Do NOT raise it to 4 (= DEBUG): the net stack's DBG
#     output costs ~425 us per packet at 115200 and would show up as a
#     throughput number (the port record (ethernet) §3.28.6). ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_SPEED_OPTIMIZATIONS=y
