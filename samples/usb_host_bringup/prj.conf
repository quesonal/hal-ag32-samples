#
# AgRV2K USB0 host bring-up self-check. Driver-level only: it calls the UHC
# API directly instead of going through the host stack, so it needs neither a
# device on USB0 nor the usbh threads.

CONFIG_UHC_DRIVER=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_UHC_DRIVER_LOG_LEVEL_INF=y

CONFIG_MAIN_STACK_SIZE=4096
