sample:
  name: usb_host_bringup
  description: |
    USB0 host bring-up self-check for AgRV2K that needs **no device** on the
    connector: it drives the UHC API directly and checks that the controller
    really is in host mode (USBMODE.CM), that both schedule base registers are
    programmed and aligned, that enable() set the run/schedule bits and the
    interrupt mask, that PORTSC agrees with the connect event it did or did
    not receive, and that disable() stops the controller again. The HIL
    counterpart of the native suite in tests/drivers/usb/uhc/uhc_agm.
tests:
  sample.usb_host_bringup.agm_agrv2k_407:
    build_only: true
    platform_allow:
      - agrv2k_407
    integration_platforms:
      - agrv2k_407
    tags:
      - ci_build
      - hal_ag32
      - drivers
      - usb
      - uhc
      - host
      - agrv2k

  # Device-testing (HIL): runs on the board and needs nothing plugged into
  # USB0. A connected device only flips which of the two port states is the
  # expected one -- the checks hold either way.
  sample.usb_host_bringup.hil.agm_agrv2k_407:
    harness: console
    harness_config:
      type: one_line
      regex:
        - "usb_host_bringup: [0-9]+ checks - PASS"
    timeout: 60
    platform_allow:
      - agrv2k_407
    integration_platforms:
      - agrv2k_407
    tags:
      - hil
      - hal_ag32
      - usb
