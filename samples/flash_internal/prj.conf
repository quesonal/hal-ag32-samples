#
# Self-test for the on-die flash driver (drivers/flash/flash_agm.c): erase,
# program and read back a scratch sector, plus the negative cases the driver
# is supposed to reject.
CONFIG_XIP=y

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
