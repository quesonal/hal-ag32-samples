#
# Twister metadata for can_listen. Build-only: the sample passively
# listens to a live CAN bus (an attached peer must be transmitting),
# so it is not runnable under twister.
sample:
  name: can_listen
  description: CAN0 RX monitor (NORMAL + accept-all) — SJA1000 telemetry + pin probe
tests:
  sample.can_listen.agm_agrv2k_407:
    build_only: true
    # LISTEN-ONLY receive IS validated on hardware (2026-09-12): an ESP32-C3
    # TWAI in LISTEN_ONLY mode decoded 2615 consecutive id=0x123 frames from
    # an AG32 that never got an ACK (see `the development notes (not published here)`).
    # `skip` stays only because twister has no live bus to listen to.
    skip: true
    platform_allow:
      - agrv2k_407
    integration_platforms:
      - agrv2k_407
    tags:
      - ci_build
      - hal_ag32
      - drivers
      - can
