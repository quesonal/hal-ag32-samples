#
# The board's Kconfig.defconfig already selects:
#   CONSOLE / UART_CONSOLE / SERIAL / UART_AGM
#   GPIO / GPIO_STELLARIS / PINCTRL
#   SYS_CLOCK_EXISTS / RISCV_MACHINE_TIMER
# This file makes those choices explicit so the sample is self-documenting
# and twister does not need to read the board defconfig to know what is
# required.

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_AGM=y

CONFIG_GPIO=y
CONFIG_GPIO_STELLARIS=y

CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Execute-in-place: place .text in FLASH (0x80000000) and copy .data
# to SRAM (0x20000000) at boot. Without this, Zephyr's default linker
# puts ALL segments in SRAM, and the AgRV2K ROM bootloader does not
# copy the BIN from FLASH to SRAM — so the CPU executes the FLASH image
# but every .data access goes to empty SRAM, leaving the firmware in a
# stuck state. CONFIG_XIP=y is the canonical fix; the reset vector
# becomes a copy-loop that the SDK's BIN-mode flash flow expects.
CONFIG_XIP=y
