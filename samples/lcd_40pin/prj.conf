#
# Console + GPIO only: the 8080 bus is bit-banged, and the pin map is the
# sample's board overlay. See samples/hello_world/prj.conf for why CONFIG_XIP.

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_AGM=y

CONFIG_GPIO=y
CONFIG_GPIO_STELLARIS=y

CONFIG_I2C=y
CONFIG_I2C_AGM=y

# Capacitive touch on the adapter (GT911); selects INPUT + INPUT_TOUCH.
CONFIG_INPUT=y
CONFIG_INPUT_GT911=y

CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_XIP=y
