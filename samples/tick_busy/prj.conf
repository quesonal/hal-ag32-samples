#
# Busy-path tick regression demo (`the development notes (not published here)`):
#   main() sleeps 1 s per loop while a lower-priority worker thread
#   busy-spins forever (never sleeps/yields). The kernel therefore
#   NEVER enters the idle thread between main's sleeps.
#
#   Before Phase 3.15 (polling-mode timer): ticks were announced only
#   from arch_cpu_idle, so main's sleep deadline never fired while the
#   worker hogged the CPU -- console printed one line and froze.
#   With the MTIP-driven riscv_machine_timer (Phase 3.15) the deadline
#   is serviced by the MTIP ISR regardless of who is running, so main
#   wakes every second and preempts the worker.

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y
CONFIG_MAIN_THREAD_PRIORITY=0
