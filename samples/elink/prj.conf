#
# Console + GPIO only: the EPD's SPI is bit-banged, and the pin map is the
# sample's board overlay. See samples/hello_world/prj.conf for why CONFIG_XIP.

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_AGM=y

CONFIG_GPIO=y
CONFIG_GPIO_STELLARIS=y

# The panel's bus runs on the SPI1 engine (spi_agm); only D/C#, RST_N and
# BUSY_N are GPIOs. The engine's longer transfers use the system DMAC.
CONFIG_SPI=y
CONFIG_DMA=y

CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_XIP=y
