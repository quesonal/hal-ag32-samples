CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# crc32_ieee(): CONFIG_CRC drives subsys/crc, and with the zephyr,crc chosen
# node enabled in this board's overlay Zephyr turns on CRC_HW_HANDLER, which
# replaces the weak software implementation with the driver-backed one. The
# only file that has to say anything is the overlay.
CONFIG_CRC=y
