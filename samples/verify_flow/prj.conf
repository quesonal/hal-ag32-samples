# SPDX-License-Identifier: Apache-2.0
#
# The application half of the end-to-end verification flow: it runs from the
# loader's on-die slot, reads back the boot record the loader wrote, and prints
# the ledger tools/verify_flow.sh asserts on.
CONFIG_XIP=y
CONFIG_USE_DT_CODE_PARTITION=y

# Chain-loaded image: the loader already brought the fabric up and switched the
# CPU onto the bitstream's PLL. Repeating soc.c's bring-up would deactivate the
# fabric this image is clocked from (port record 3.26.9).
CONFIG_AGM_SOC_SKIP_CLOCK_INIT=y

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Reading the boot record back to the console is the point of this sample, so
# the boot driver is linked here too (read-only use: info_get + the trial
# handshake). It needs the on-die flash driver and the CRC unit.
CONFIG_FLASH=y
CONFIG_FLASH_AGM=y
CONFIG_CRC=y

# The ledger is printed from a single thread; the boot driver's init runs at
# PRE_KERNEL_1 and wants a little stack for its own banner.
CONFIG_MAIN_STACK_SIZE=4096
