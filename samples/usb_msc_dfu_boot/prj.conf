# SPDX-License-Identifier: Apache-2.0
#
# UF2-style USB MSC upload channel for the spi_boot_loader DFU (agrv2k_407).
#
# This image is a payload that runs from the loader's on-die application
# slot. It publishes a fake 64 MiB FAT16 volume (src/uf2_volume.h) so a host
# mounts a drive and copies a .uf2 onto it; the sample parses the writes as a
# UF2 block stream and pushes the payload straight into the loader's A/B
# store through the boot driver's upload API (agm_boot_upload_begin/write/
# finish), closes the MSC interface and reboots. Model: a UF2 bootloader.
#
# It is the "USB MSC" upload path next to the loader's console / AN3155 /
# mcumgr paths (docs/BOOT-DFU-STATUS.md 0.1, the update section). No file
# system, no flash staging area, no image in SRAM.

# XIP into the on-die application slot the loader owns; see
# boards/agrv2k_407.overlay and samples/spi_boot_app.
CONFIG_XIP=y
CONFIG_USE_DT_CODE_PARTITION=y

# Chain-loaded image: the loader already brought the fabric up and switched
# the CPU onto the bitstream's PLL. Repeating soc.c's bring-up would
# deactivate the fabric this image is clocked from.
CONFIG_AGM_SOC_SKIP_CLOCK_INIT=y

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# The boot driver (drivers/misc/boot_agm.c) and the on-die flash it writes
# the stores through.
CONFIG_FLASH=y
CONFIG_FLASH_AGM=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y
CONFIG_REBOOT=y

# The USB side: a single MSC LUN backed by the sample's own fake FAT volume
# (registered at runtime with disk_access_register(), see src/main.c).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_DISK_ACCESS=y

# The UF2 block handler runs in the MSC class thread and calls into the boot
# driver's upload API (which erases/programs the store), so give that thread
# room beyond the 1024-byte default.
CONFIG_USBD_MSC_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_MSC_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

CONFIG_SAMPLE_USBD_PID=0x0008
CONFIG_SAMPLE_USBD_PRODUCT="AgRV2K USB MSC DFU (boot)"

# udc_agm is FS-only (64 B bulk MPS).
CONFIG_USBD_MAX_SPEED_FULL=y

# No HWINFO -> no iSerialNumber descriptor.
CONFIG_HWINFO=n

CONFIG_SAMPLE_USBD_SELF_POWERED=n
CONFIG_SAMPLE_USBD_REMOTE_WAKEUP=n
CONFIG_SAMPLE_USBD_MAX_POWER=50

CONFIG_MAIN_STACK_SIZE=3072
