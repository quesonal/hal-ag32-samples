#
# Composite USB MSC + DFU device (agrv2k_407).
#
# One full-speed device that shows the same in-RAM disk two ways:
#   * an MSC (Bulk-Only Transport) LUN the host sees as a removable disk,
#   * the DFU class, whose image "ramdisk0" is that same disk.
#
# The DFU runtime interface is registered by sample_usbd_init.c; after
# `dfu-util --detach` main.c rebuilds the context in DFU mode.

CONFIG_USB_DEVICE_STACK_NEXT=y

# One MSC LUN (the "RAM" ramdisk) plus the DFU class; both reach the disk
# through the disk_access API.
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_DFU=y
CONFIG_DISK_ACCESS=y

# UART0 (the CMSIS-DAP bridge, ttyACM0 on the host) stays the console so the
# PASS/FAIL verdicts are readable independently of the USB0 data path.
CONFIG_STDOUT_CONSOLE=y

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_MSC_LOG_LEVEL_WRN=y
CONFIG_USBD_DFU_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

CONFIG_SAMPLE_USBD_PID=0x0007
CONFIG_SAMPLE_USBD_PRODUCT="AgRV2K USB MSC+DFU"

# udc_agm is FS-only (64 B bulk MPS); keep the stack off the HS descriptor
# path so no device-qualifier descriptor claims a dead high-speed alt.
CONFIG_USBD_MAX_SPEED_FULL=y

# DFU transfer size == the ramdisk sector size, so every DFU block maps onto
# exactly one disk sector (see the BUILD_ASSERT in src/main.c).
CONFIG_USBD_DFU_TRANSFER_SIZE=512

# No HWINFO -> no iSerialNumber descriptor (the AgRV USB path prefers
# iSerialNumber = 0; see usb_cdc_echo's prj.conf for the history).
CONFIG_HWINFO=n

# Bus-powered, 100 mA, no remote wakeup: the probe's hub cannot source the
# self-powered/250 mA combination some hosts stall on.
CONFIG_SAMPLE_USBD_SELF_POWERED=n
CONFIG_SAMPLE_USBD_REMOTE_WAKEUP=n
CONFIG_SAMPLE_USBD_MAX_POWER=50
