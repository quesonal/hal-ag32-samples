# SPDX-License-Identifier: Apache-2.0
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# The fabric-change evidence is a SPI NOR RDID probe: which controller reaches
# the flash, and whether the engine sees MISO at all, is a property of the
# bitstream that is live. Same SPI/DMA set as samples/spi_flash_id.
CONFIG_SPI=y
CONFIG_DMA=y

# The sample re-asserts the console/SPI pin routes after the swap (the new
# bitstream owns AFSEL at ACTIVATE), so pinctrl must be on.
CONFIG_PINCTRL=y

# CPU clock-frequency is a devicetree literal (kernel tick) — nothing to set
# here. No CONFIG_REBOOT: this sample's whole point is *not* rebooting.
