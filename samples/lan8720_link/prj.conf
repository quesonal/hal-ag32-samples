# --- Console / XIP ---
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# --- Networking: bring up the Zephyr net stack + L2 Ethernet, IPv4
#     only (saves code space + DHCPv6 init time) ---
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=n
CONFIG_ETH_DRIVER=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y

# --- Static IPv4 for the board (override at build time with
#     -DCONFIG_NET_CONFIG_MY_IPV4_ADDR=...). The ICMP echo target is
#     CONFIG_LAN8720_LINK_PING_TARGET_IP (see Kconfig). ---
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.15.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.15.254"

# --- Buffer budgets (8/8 pkt + 16/16 buf is enough for the ICMP probe) ---
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_NET_MAX_CONTEXTS=5

# --- Driver: same as the link-only baseline, keep symbols in sync ---
CONFIG_ETH_AGM=y
CONFIG_MDIO_AGM=y
CONFIG_PHY_AGM_LAN8720=y

# --- Entropy for the TCP / IP stacks (kept on for compatibility with
#     lan8720_iperf's buffer pool; net_icmp doesn't actually need it
#     but it's cheap and removes a "no entropy" warning) ---
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# --- LOG: 3 = INFO (the sample's LOG_INF/LOG_ERR lines), immediate
#     mode so the PASS/FAIL line is on the wire before the console
#     drains.
#
#     Do NOT raise this to 4 (= DEBUG): every module that does not
#     declare its own level then logs at DBG, and the net stack's DBG
#     output is ~425 ms per packet at 115200 with LOG_MODE_IMMEDIATE.
#     That dwarfs the MAC round trip -- see the port record (ethernet)
#     §3.28.6 (measured: 392 ms vs 1.7 ms RTT, same firmware). ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
