# AgRV2K USB0 HID mouse demo (device-next stack, usbd_hid class).

CONFIG_USB_DEVICE_STACK_NEXT=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y

# Host side needs the class + interface to enumerate cleanly. Keep the
# HID class logs at WRN; udc_agm DBG traces live behind their own option.
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# 0x2fe3 is the Zephyr Project VID (upstream sample convention).
CONFIG_SAMPLE_USBD_PID=0x0008
CONFIG_SAMPLE_USBD_PRODUCT="AgRV2K USB HID Mouse"

# === hal_ag32 §3.21 fixes (same as usb_cdc_echo); the write-up is in the
# development notes (not published here).
# No iSerialNumber string: leave CONFIG_HWINFO off so no descriptor
# points at an empty STRING/3 index.
CONFIG_HWINFO=n

# Bus-powered, modest current (the USB-C hub / VMware path is picky
# about self-powered + high max-power declarations).
CONFIG_SAMPLE_USBD_SELF_POWERED=n
CONFIG_SAMPLE_USBD_REMOTE_WAKEUP=n
CONFIG_SAMPLE_USBD_MAX_POWER=50
