# SPDX-License-Identifier: Apache-2.0
sample:
  name: usb_host_enum
  description: |
    USB0 host-mode enumeration sample for AgRV2K (drivers/usb/uhc/uhc_agm.c,
    ported from TinyUSB's ChipIdea/EHCI host driver). The board acts as a USB
    host: plug any full-speed device into the USB0 connector and the host
    stack runs it through bus reset, GET_DESCRIPTOR(8), SET_ADDRESS,
    GET_DESCRIPTOR(18) and SET_CONFIGURATION, then the sample's class prints
    the device's address, speed, VID/PID and class codes with a PASS line.
    Unplugging prints the removal line. No GPIOs or extra wiring are needed
    beyond the USB0 cable; the bitstream must be in USB0 host mode.
tests:
  sample.usb_host_enum.agm_agrv2k_407:
    build_only: true
    platform_allow:
      - agrv2k_407
    integration_platforms:
      - agrv2k_407
    tags:
      - ci_build
      - hal_ag32
      - drivers
      - usb
      - uhc
      - host
      - agrv2k

  # Device-testing (HIL): the controller and the host stack come up with
  # nothing plugged into USB0 -- this is the "no device required" half of the
  # host path, and it also proves the usbh threads and the class registration
  # did not fall over at boot.
  sample.usb_host_enum.hil.agm_agrv2k_407:
    harness: console
    harness_config:
      type: one_line
      regex:
        - "main: USB0 host is up"
    timeout: 60
    platform_allow:
      - agrv2k_407
    integration_platforms:
      - agrv2k_407
    tags:
      - hil
      - hal_ag32
      - usb
