# AgRV2K USB0 host-mode enumeration sample (uhc_agm + the Zephyr host stack).

# USB host stack; it selects UHC_DRIVER, and UHC_AGM follows from the
# enabled &uhc0 node (see boards/agrv2k_407.overlay).
CONFIG_USB_HOST_STACK=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# Bump these to DBG when the host path misbehaves: the stack then logs every
# chapter-9 request with its completion error, and the driver logs every armed
# qTD chain.
CONFIG_USBH_LOG_LEVEL_INF=y
CONFIG_UHC_DRIVER_LOG_LEVEL_INF=y

# Enumeration runs in the host stack's own threads (the bus thread drives the
# control transfers and parses the descriptors), so both need room for the
# logging in this sample.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_USBH_STACK_SIZE=4096

# One device at a time is enough for this sample's purpose.
CONFIG_USBH_USB_DEVICE_MAX=2
