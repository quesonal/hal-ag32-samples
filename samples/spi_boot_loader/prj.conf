#
# Stage-1 loader: lives in the on-die flash (XIP), owns a boot record and a
# payload in the on-board SPI NOR, and jumps into the payload.
CONFIG_XIP=y

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# External SPI NOR on SPI0 (through the fabric patch in the canonical
# bitstream) -- same stack samples/spi_nor_flash uses. The default layout keeps
# everything on-die and does not touch the NOR at all, so these are only needed
# for boards/agrv2k_407_ext_nor.overlay; leaving them on costs ~9 KB of a
# 96 KiB region and keeps one binary working for both.
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
# The on-die flash driver (drivers/flash/flash_agm.c) is what lets the loader
# write the application slot at 0x80010000.
CONFIG_FLASH_AGM=y
CONFIG_FLASH_PAGE_LAYOUT=y
# The engine's long transfers (page reads/writes) stream through DMA, and
# the SPI driver's config keeps a DMA device pointer -- without CONFIG_DMA
# the link fails on the DMA device object. Same as the other SPI samples.
CONFIG_DMA=y

# Boot record + payload CRC.
CONFIG_CRC=y

# The backup-domain IWDG is pulled in by CONFIG_BOOT_AGM_TRIAL_WATCHDOG (the
# loader arms it right before a trial boot so an image that hangs resets the
# board instead of wedging it -- the A/B attempt counter only advances on a
# reset). See the trial-boot handshake in
# include/zephyr/drivers/misc/boot_agm.h; the board overlay enables &iwdg0.
# The on-die A/B layout, whose loader region is 64 KiB, turns the feature off
# instead (see boards/agrv2k_407_on_die_ab.overlay and sample.yaml).

# The `reboot` command: after a bitstream update the new fabric only takes
# effect on the next boot (the boot path programs the FCB from flash).
CONFIG_REBOOT=y

# The loader's informational boot log (which fabric slot the FCB streamed this
# boot, and similar) sits behind this switch so a production image does not
# spend early-console time on it; the loader sample keeps it on because the
# dev-board workflow reads those lines (-15).
CONFIG_BOOT_AGM_VERBOSE_LOG=y

# mcumgr (SMP) -- the second host protocol next to AN3155/agrv32flash. Only
# the transport layer is taken from Zephyr; the image management group is the
# boot driver's (it keeps CRC32 records and its own stores, where the stock
# group wants MCUboot image headers and a flash map). CONFIG_BOOT_AGM_SMP
# selects CONFIG_MCUMGR_TRANSPORT_SERIAL_HAS_SMP_OVER_CONSOLE, which pulls in
# the base64 line framing helpers (mcumgr_serial_process_frag/_tx_pkt) without
# enabling the UART driver that would take the console port for itself.
# CONFIG_MCUMGR is "depends on" these two, so they have to be on as well
# (otherwise MCUMGR is silently forced back to n).
CONFIG_ZCBOR=y
CONFIG_NET_BUF=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_OS=y
# The hosts ask for the MCUmgr parameters before the first upload (smpmgr
# fails with "is the device an SMP server?" without it): it tells the client
# how big a chunk it may send.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
# The console loop below polls the UART without ever blocking (that is what
# keeps the tail of a typed line from being dropped), so the mcumgr request
# work queue has to preempt it -- at the default priority 3 (below main's 0)
# it would never get to run and every SMP request would time out.
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_THREAD_PRIO=-1
# ... and that work queue is where an upload's *verification* runs (the
# publish happens in the chunk handler), so its stack has to hold the whole
# crypto chain: the container hash, the ECDSA/RSA check and -- with
# CONFIG_BOOT_AGM_BIND -- the per-chip tag. The Zephyr default (2048) is not
# enough for all three: measured 2026-09-24, a bound loader with the default
# overflowed this stack inside the check, corrupted a saved return address and
# faulted with an illegal instruction (mcause 2, mepc in RAM below the stack)
# right after printing the refusal; 4096 runs the same upload cleanly. A
# signed build without binding fits in 2048, which is why this only shows up
# now. drivers/misc/boot_agm_bind.c asserts the floor at compile time.
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_BASE64=y

# The console is polled straight off the UART device: Zephyr's console
# helpers are a choice between console_getchar() and console_getline(), and
# this loader needs both styles -- a non-blocking "is a key pending?" for the
# boot window (the equivalent of the vendor DFU's "stay in DFU" button) and a
# blocking line reader for commands.

CONFIG_MAIN_STACK_SIZE=3072
