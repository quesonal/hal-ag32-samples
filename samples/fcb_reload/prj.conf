CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# The probe reads the SPI NOR's RDID to tell which bitstream is live, so
# this is the same SPI/DMA set as spi_flash_id. No CONFIG_REBOOT: the
# sample never reboots itself — reloading means flash_logic.sh + reboot.
CONFIG_SPI=y
CONFIG_DMA=y
