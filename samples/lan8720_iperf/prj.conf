# --- Console / XIP ---
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# --- Networking: Zephyr net stack + L2 Ethernet, IPv4 only (no IPv6:
#     saves code space and DHCPv6 init time) ---
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
# UDP is needed by the LAN8720_IPERF_PROTO_UDP variant; it is cheap
# enough to leave on for the TCP variant as well.
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=n
CONFIG_ETH_DRIVER=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y

# --- Static IPv4 for the board (override at build time with
#     -DCONFIG_NET_CONFIG_MY_IPV4_ADDR=...). The server address is the
#     LAN8720_IPERF_SERVER_IP Kconfig in this sample. ---
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.15.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.15.254"

# --- Buffer budget: this is the sample's main tuning knob.
#
#     NET_BUF_DATA_SIZE is raised from the default 128 to the Ethernet
#     MTU so one TCP segment (1460 B payload + 14/20/20 headers =
#     1514 B) fits in a single net_buf instead of being split across a
#     dozen 128 B fragments. That fragment churn is pure CPU, and on
#     this part the CPU (100 MHz, no cache, XIP flash) is the
#     throughput bottleneck long before the 100 Mb wire is.
#
#     NET_BUF_TX_COUNT then sets how much data can be in flight: at
#     1460 B segments per buffer, N buffers ~= N * 1460 B of send
#     window (~12 KB at 8, ~23 KB at 16). If throughput plateaus and
#     zperf logs "network buffer allocation errors", raise it -- zperf
#     also reports that count back as nb_packets_errors.
#
#     RAM: the pools take ~38 KB of the 128 KB on-chip RAM; check with
#     `west build -d <dir> -t ram_report`. ---
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_HEAP_MEM_POOL_SIZE=8192

# TX descriptors set the in-flight window for the MAC: eth_agm_send()
# no longer waits for each frame to complete, so the number of
# descriptors is what bounds how many frames can be queued behind the
# one being transmitted. 4 was enough for a single-frame-at-a-time
# driver; 8 gives the UDP flood somewhere to go.
CONFIG_ETH_AGM_TX_DESCRIPTORS=8

# zperf_tcp_upload() blocks the calling thread and runs the socket +
# net_buf paths on that thread's stack; the 1 KB default main stack is
# not enough.
CONFIG_MAIN_STACK_SIZE=4096

# --- Driver: same as lan8720_link, keep the symbols in sync ---
CONFIG_ETH_AGM=y
CONFIG_MDIO_AGM=y
CONFIG_PHY_AGM_LAN8720=y

# --- Entropy for the TCP stack ---
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# --- zperf: client side only. Server off (we never accept connections)
#     and shell off (unused, ~30 KB ROM). MAX_PACKET_SIZE must be >=
#     this sample's LAN8720_IPERF_PACKET_SIZE -- main.c has a
#     BUILD_ASSERT so a mis-set pair fails the build instead of being
#     silently clamped. ---
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=n
# 1514 so the dev board-only RAW mode can push a full-size frame (14 B
# Ethernet header + 1500 B); the UDP/TCP modes only need 1460 and
# assert that their own headers still fit the MTU.
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1514

# --- LOG: 3 = INFO (this sample's LOG_INF lines plus zperf's own
#     NET_WARN/NET_ERR), immediate mode so the PASS/FAIL line is on the
#     wire before the console drains.
#
#     Do NOT raise this to 4 (= DEBUG): every module that does not
#     declare its own level then logs at DBG, and the net stack's DBG
#     output costs ~425 ms per packet at 115200 with LOG_MODE_IMMEDIATE.
#     That would be measuring the console, not the link -- see
#     the port record (ethernet) §3.28.6 (same firmware measured
#     392 ms vs 1.7 ms round trip purely on this setting). ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

# --- Throughput: build for speed, not size. ---
CONFIG_SPEED_OPTIMIZATIONS=y
