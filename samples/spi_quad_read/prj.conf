# SPDX-License-Identifier: Apache-2.0
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# SPI driver + DMA (RX longer than four bytes goes through DMA).
CONFIG_SPI=y
CONFIG_DMA=y

# Required to use SPI_LINES_DUAL/QUAD: without this, spi_operation_t
# is uint16_t and the LINES_* bits (bits 16..17) get truncated away
# at compile time, so the driver's multiline dispatch never fires.
CONFIG_SPI_EXTENDED_MODES=y
