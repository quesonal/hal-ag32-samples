# SPDX-License-Identifier: Apache-2.0
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# The engine clocks the transfer (spi_agm) ...
CONFIG_SPI=y
# ... and the fabric side is read through the CPLD window + its FIFO DMA.
CONFIG_DMA=y

# Test 7 exercises the driver's device runtime PM: every transfer above then
# runs through the resume/suspend pair as well.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
