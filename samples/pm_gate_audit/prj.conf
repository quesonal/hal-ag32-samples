CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# CONFIG_PM_DEVICE_RUNTIME is intentionally left off: enabling it drags
# every PM-aware device (timer, sysctrl, ...) into the link with its
# DEVICE_DT_INST_DEFINE, and this sample does not need that path to
# read APB_CLKENABLE. The driver-level runtime PM path is exercised by
# samples/spi_loopback instead, where the loopback transfer asks for
# the gate to open. This sample's third print ("all-PM-aware-put")
# requires CONFIG_PM_DEVICE_RUNTIME=y; build it explicitly with
# `-DCONFIG_PM_DEVICE_RUNTIME=y` if you want the third reading.
