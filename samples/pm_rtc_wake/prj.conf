CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# §3.7/§3.20: kernel idle path -> pm_state_set(); RTC alarm as the
# stop-mode wake source (rtc0 enabled in the board overlay).
CONFIG_PM=y
# Device PM: devices with a PM action are suspended before Stop and resumed
# after it (the runtime-PM-enabled ones are skipped). A device that refuses to
# suspend vetoes the sleep, so the round counters below double as that check.
# Note Standby resets the SoC: the resume side there is the next boot.
CONFIG_PM_DEVICE=y
CONFIG_COUNTER=y
CONFIG_LOG=y

# gpio-leds (on-board LED1 via the Zephyr GPIO API)
CONFIG_GPIO=y
CONFIG_GPIO_STELLARIS=y
