#
# GPIO bank-interrupt end-to-end demo (`the development notes (not published here)`):
#   GPIO6 pin edge -> Stellaris GPIO MIS -> PLIC line 13 -> MEIP
#   -> plic_irq_handler -> sw_isr_table[45] gpio_stellaris_isr
#   -> gpio_add_callback handler. Uses the vanilla ti,stellaris-gpio
#   driver (no raw MMIO for the interrupt path or the LED blink —
#   the LEDs are gpio-leds on gpio4). The only raw write left is the
#   GpioIE re-assert for the AgRV IE-polarity quirk (see main.c).

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_GPIO=y
CONFIG_GPIO_STELLARIS=y
CONFIG_XIP=y
