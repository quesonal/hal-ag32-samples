# SPDX-License-Identifier: Apache-2.0
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# The driver that owns the window this sample's slice lives in.
CONFIG_CPLD_AGM=y

# Reading a register block the bitstream does not decode stalls the CPU (the
# AHB handshake never completes), so the default build only resolves the
# devicetree and prints it. Turn this on for a board that has the IP.
# CONFIG_APP_USER_IP_TOUCH_BUS=y
