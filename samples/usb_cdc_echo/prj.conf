#
# USB CDC-ACM echo sample (`the development notes (not published here)`).
#
# Notes:
# - We deliberately leave CONFIG_STDOUT_CONSOLE=y. UART0 is wired to
#   the CMSIS-DAP probe (ttyACM0 on the host is the debug bridge,
#   not the CDC-ACM device), so the printk path stays usable for
#   diagnostics without colliding with the CDC-ACM data path.
# - CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n keeps the CDC-ACM DLM off
#   until main() explicitly enables rx IRQ, so the host gets a clean
#   DTR/DSR handshake before any data starts flowing.

CONFIG_USB_DEVICE_STACK_NEXT=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="AgRV2K USB CDC-ACM"

# === §3.21 fix: disable CONFIG_HWINFO so sample_usbd_init.c does
# not register a USBD_DUT_STRING_SERIAL_NUMBER descriptor (would point
# at index 3 with no actual string, host/VMware stalls on GET_DESCRIPTOR
# STRING/3). iSerialNumber stays at 0 in the device descriptor.
CONFIG_HWINFO=n

# === §3.21 fix: full-speed only; sample_usbd has HS descriptors by
# default but our controller is FS-only. Drop the HS support so the
# device-qualifier descriptor doesn't claim a non-functional HS alt.
CONFIG_USBD_MAX_SPEED_FULL=y

# === §3.21 fix: drop self-powered + max-power flags. CMSIS-DAP reference
# uses bmAttributes=0x80 (bus-powered, no remote wakeup) with 100 mA.
# VMware's CDC ACM passthrough reportedly stalls on devices that declare
# self-powered + 250 mA over a USB-C hub that can't provide it.
CONFIG_SAMPLE_USBD_SELF_POWERED=n
CONFIG_SAMPLE_USBD_REMOTE_WAKEUP=n
CONFIG_SAMPLE_USBD_MAX_POWER=50
