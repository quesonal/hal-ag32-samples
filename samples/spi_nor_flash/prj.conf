# SPDX-License-Identifier: Apache-2.0
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# The Zephyr SPI NOR driver sits on top of the AgRV2K SPI driver.
CONFIG_SPI=y
CONFIG_FLASH=y

# The flash driver reports why it refuses to come up (JEDEC ID mismatch,
# failed command, ...) through the log.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# The layout page size is what flash_erase()/flash_write() are aligned to;
# 4 KiB is this part's smallest erase (0x20 sector erase) and what the write
# test wants. The driver's own erase types come from its SFDP or, here, the
# minimal table, not from this value.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_FLASH_PAGE_LAYOUT=y

# Page reads go through the engine's RX DMA path.
CONFIG_DMA=y
