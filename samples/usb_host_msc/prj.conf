#
# AgRV2K USB0 host-mode Mass Storage sample (uhc_agm + a sample-local BOT/SCSI
# class). Unlike usb_host_enum this one drives bulk transfers, so it is the
# first thing that exercises the driver's bulk path at all.

CONFIG_USB_HOST_STACK=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USBH_LOG_LEVEL_INF=y
CONFIG_UHC_DRIVER_LOG_LEVEL_INF=y

# Bump to DBG to see every chapter-9 request and every armed qTD chain.
# CONFIG_USBH_LOG_LEVEL_DBG=y
# CONFIG_UHC_DRIVER_LOG_LEVEL_DBG=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_USBH_STACK_SIZE=4096
CONFIG_USBH_USB_DEVICE_MAX=2

# The performance test moves 16 KiB per SCSI command in one bulk transfer, so
# the pool has to hold that plus the CBW/CSW and enumeration buffers. The
# default 1 KiB is far too small.
CONFIG_UHC_BUF_POOL_SIZE=32768
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_XFER_COUNT=16
