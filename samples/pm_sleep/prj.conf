CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# §3.7 system PM: enables the kernel idle path to call
# pm_state_set() -> AG32 sleep mode (suspend-to-idle).
CONFIG_PM=y

# Device PM: every device with a PM action is suspended before the sleep and
# resumed after it (runtime-PM-enabled devices are skipped -- they are already
# suspended while idle). A device whose action fails vetoes the sleep
# altogether, so the entry counters below prove nobody did.
CONFIG_PM_DEVICE=y

# gpio-leds (on-board LED1 via the Zephyr GPIO API)
CONFIG_GPIO=y
CONFIG_GPIO_STELLARIS=y
