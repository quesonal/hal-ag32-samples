#
# AgRV2K USB0 host-mode HID sample: polls the interrupt IN endpoint of a
# mouse/keyboard (or a wireless receiver) and prints every report.

CONFIG_USB_HOST_STACK=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USBH_LOG_LEVEL_INF=y
CONFIG_UHC_DRIVER_LOG_LEVEL_INF=y

# Bump to DBG to see every chapter-9 request and every armed qTD chain.
# CONFIG_USBH_LOG_LEVEL_DBG=y
# CONFIG_UHC_DRIVER_LOG_LEVEL_DBG=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_USBH_STACK_SIZE=4096
CONFIG_USBH_USB_DEVICE_MAX=2
