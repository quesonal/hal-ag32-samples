#
# XIP into the application slot (0x8007c000 with the default layout, see
# boards/agrv2k_407.overlay). spi_boot_loader writes this image into the slot
# and jumps to it -- the only place a payload runs, now that the legacy
# `mode external` (copy into SRAM) path is gone.
CONFIG_XIP=y

# Link into /chosen/zephyr,code-partition (the slot set by
# boards/agrv2k_407.overlay). Zephyr defaults this off, and with it
# off the code-partition has no effect: the image is linked at the flash base
# regardless (measured -- the first attempt produced entry 0x80000000).
CONFIG_USE_DT_CODE_PARTITION=y

# Chain-loaded image: the loader already brought the fabric up and switched
# the CPU onto the bitstream's PLL. Repeating soc.c's bring-up would
# deactivate the fabric this image is clocked from (see prj.conf and
# the port record (peripherals) 3.26.9).
CONFIG_AGM_SOC_SKIP_CLOCK_INIT=y

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=2048
