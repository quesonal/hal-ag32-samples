CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# SPI NOR work goes through the AgRV2K phase-engine SPI driver.
CONFIG_SPI=y

# Test 8 drives the interrupt path (the engine raises its IRQ at SPI_DONE).
CONFIG_SPI_ASYNC=y

# Test 10 checks runtime PM: the driver gates the controller's APB clock while
# idle, and resumes on the next transfer.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Test 11 sleeps the SoC (the same WFI path pm_sleep uses) to see how the
# controller's PM behaves across a real sleep entry/exit.
CONFIG_PM=y

# Test 13 reads 4 KiB at a time to show what the line count alone buys; one
# transfer has to fit the driver's RX bounce buffer.
CONFIG_SPI_AGM_RX_BOUNCE_BYTES=4096

# Page programs are 260-byte frames: past the engine's eight register-fed
# phases, so they stream out of memory with the engine's TX DMA. Reads of
# the same length come back through the RX DMA.
CONFIG_DMA=y
