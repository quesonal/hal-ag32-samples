#
# k_busy_wait's time base: the same console plumbing hello_world uses, because
# the point of the sample is what it prints (and, on the host side, when the
# lines arrive -- see src/main.c).

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_AGM=y

CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# The AgRV2K ROM bootloader does not copy a BIN from flash to SRAM, so code has
# to execute in place (same reason as hello_world).
CONFIG_XIP=y
