# SPDX-License-Identifier: Apache-2.0
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# SPI0 is the on-board SPI flash controller on every AgRV2K variant; the
# driver (drivers/spi/spi_agm.c) claims the node as soon as the board
# overlay marks it status-okay.
CONFIG_SPI=y

# Long (>4 B) transfers stream through the engine's phase data register with
# DMA, so the DMA controller has to be in the build.
CONFIG_DMA=y
