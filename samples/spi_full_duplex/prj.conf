CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XIP=y

# The on-die controller clocks the transfer; the fabric captures RX.
CONFIG_SPI=y

# The fabric RX FIFO is drained with the DMA controller (EXT_DMA0 request).
CONFIG_DMA=y

# The fabric side lives in the CPLD window (cpld0), which the sample's
# board overlay turns on.
